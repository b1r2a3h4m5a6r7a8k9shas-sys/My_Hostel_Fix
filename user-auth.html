<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login &amp; Sign Up</title>
<style>
body{margin:0;min-height:100vh;padding:20px;font-family:sans-serif;color:#e2e8f0;background:radial-gradient(circle,#134e4a,#0f172a);box-sizing:border-box}
.top{display:flex;justify-content:flex-end;gap:8px}
button,input{padding:9px 14px;border:none;border-radius:8px;font-size:15px}
button{background:#5eead4;color:#0f172a;font-weight:bold;cursor:pointer}
.box{max-width:340px;margin:40px auto;padding:20px;border-radius:12px;background:rgba(255,255,255,.08)}
form{display:grid;gap:10px}
.hide{display:none}
</style>
</head>
<body>
<div class="top">
<button id="bLogin" type="button">login</button>
<button id="bSign" type="button">sign up</button>
</div>
<div class="box">
<form id="fLogin">
<h2>Log In</h2>
<input id="lid" placeholder="Student ID" required>
<input type="password" placeholder="Password" required>
<button type="submit">log in</button>
</form>
<form id="fSign" class="hide">
<h2>Sign Up</h2>
<input id="sname" placeholder="Full Name" required>
<input id="sid" placeholder="Student ID" required>
<input id="sroom" placeholder="Room No" required>
<input id="semail" type="email" placeholder="Email" required>
<button type="submit">register</button>
</form>
</div>
<script>
bLogin.onclick=()=>{fLogin.classList.remove("hide");fSign.classList.add("hide")};
bSign.onclick=()=>{fSign.classList.remove("hide");fLogin.classList.add("hide")};
fLogin.onsubmit=e=>{e.preventDefault();localStorage.setItem("uid",lid.value.trim());location.href="student-dashboard.html"};
fSign.onsubmit=e=>{e.preventDefault();const u={name:sname.value.trim(),id:sid.value.trim(),room:sroom.value.trim(),email:semail.value.trim()};localStorage.setItem("user",JSON.stringify(u));localStorage.setItem("uid",u.id);location.href="student-dashboard.html"};
</script>
</body>
</html>
