<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 Questions (3.2.1)</title>
<style>
body{margin:0;min-height:100vh;padding:24px;font-family:sans-serif;color:#e2e8f0;background:radial-gradient(circle,#134e4a,#0f172a);box-sizing:border-box}
form{max-width:640px;margin:0 auto;padding:22px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;gap:12px}
h2{margin:0;color:#5eead4}
label.q{display:grid;gap:4px;font-size:14px}
textarea{padding:8px;border:none;border-radius:8px;font-size:14px;font-family:sans-serif;min-height:54px}
button{padding:10px 20px;border:none;border-radius:8px;background:#5eead4;color:#0f172a;font-weight:bold;font-size:15px;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<form id="f">
<h2>Hostel Experience Questions (3.2.1)</h2>
<div id="qs"></div>
<label><input type="checkbox" id="chk"> I have answered all 12 questions honestly.</label>
<button id="nxt" class="hide" type="button">next to 3.2.2</button>
</form>
<script src="questions-and-solutions.js"></script>
<script>
qs.innerHTML=QDATA.map((x,i)=>"<label class='q'><span>"+x.q+". "+x.ask+"</span><textarea id='a"+i+"' required></textarea></label>").join("");
chk.onchange=()=>{if(chk.checked){const ans=QDATA.map((_,i)=>document.getElementById("a"+i).value.trim()||"No answer given");localStorage.setItem("p32_ans",JSON.stringify(ans));nxt.classList.remove("hide")}else nxt.classList.add("hide")};
nxt.onclick=()=>location.href="topic-chooser.html";
</script>
</body>
</html>
