<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Question (3.2.2)</title>
<style>
body{margin:0;min-height:100vh;padding:24px;font-family:sans-serif;color:#e2e8f0;background:radial-gradient(circle,#134e4a,#0f172a);box-sizing:border-box}
.box{max-width:660px;margin:0 auto;padding:22px;border-radius:12px;background:rgba(255,255,255,.08)}
h2{margin:0 0 12px;color:#5eead4}
ul{padding-left:18px;display:grid;gap:10px}
button{margin-top:16px;padding:10px 20px;border:none;border-radius:8px;background:#5eead4;color:#0f172a;font-weight:bold;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2>Grouped Headings &amp; Main Questions (3.2.2)</h2>
<ul id="list"></ul>
<button id="nxt" type="button">next page 3.2.3</button>
</div>
<script src="questions-and-solutions.js"></script>
<script>
list.innerHTML=QDATA.map((x,i)=>"<li><label><input type='radio' name='qpick' value='"+i+"' "+(i===0?"checked":"")+"> <b>"+x.grp+":</b> "+x.ask+"</label></li>").join("");
nxt.onclick=()=>{const idx=Number(document.querySelector("input[name='qpick']:checked").value);localStorage.setItem("p32_q",idx);location.href="answer-summary.html"};
</script>
</body>
</html>
