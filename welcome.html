<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Hostel Fix</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: sans-serif;
      color: #e2e8f0;
      background: radial-gradient(circle, #134e4a, #0f172a);
    }

    h1 {
      font-size: 6vw;
      color: #5eead4;
      animation: float 3s ease-in-out infinite;
      transition: transform 0.5s ease;
    }

    body:active h1 {
      transform: translateY(25px);
      transition: none;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 9px 24px;
      background: #5eead4;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.88;
    }

    @keyframes float {
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Hostel Fix</h1>
    <p>Real hostel problems deserve real follow-through—not empty promises. We track it until it is sorted.</p>
    <a href="login.html">start</a>
  </header>
</body>
</html>
